{% extends "emails/base.html" %}

{% block body %}
<p style="margin:0 0 12px 0;font-size:15px;line-height:1.65;color:#334155;">
	Hello,
</p>
<p style="margin:0 0 12px 0;font-size:15px;line-height:1.65;color:#334155;">
	<strong>{{ comment_author }}</strong> commented on {{ noun }} <strong>{{ number }}</strong>
	in project <strong>{{ project_name }}</strong>:
</p>
<p style="margin:0 0 14px 0;font-size:14px;line-height:1.6;color:#475569;">
	{{ item_title }}
</p>
<div style="margin:0 0 6px 0;padding:12px 14px;border-left:3px solid #0b5fff;background:#f1f5f9;border-radius:0 8px 8px 0;">
	<p style="margin:0;font-size:13px;line-height:1.6;color:#334155;white-space:pre-wrap;">{{ comment_excerpt }}</p>
</div>
{% endblock %}
