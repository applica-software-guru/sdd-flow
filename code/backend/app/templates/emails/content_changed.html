{% extends "emails/base.html" %}

{% block body %}
<p style="margin:0 0 12px 0;font-size:15px;line-height:1.65;color:#334155;">
	Hello,
</p>
<p style="margin:0 0 12px 0;font-size:15px;line-height:1.65;color:#334155;">
	<strong>{{ editor_name }}</strong> updated {{ noun }} <strong>{{ number }}</strong>
	in project <strong>{{ project_name }}</strong>:
</p>
<p style="margin:0 0 14px 0;font-size:14px;line-height:1.6;color:#475569;">
	{{ item_title }}
</p>
<p style="margin:0;font-size:14px;line-height:1.6;color:#475569;">
	Changed fields: <strong>{{ changed_fields }}</strong>
</p>
{% endblock %}
